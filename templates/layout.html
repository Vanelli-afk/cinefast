<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Site Info -->
    {% if title %}
      <title>CineFast - {{ title }}</title>
    {% else %}
      <title>CineFast</title>
    {% endif %}

    <meta name="description" content="CineFast - Catálogo de filmes">
    <meta name="author" content="Miguel Vanelli">

    <!-- Open Graph -->
    <meta property="og:title" content="CineFast">
    <meta property="og:type" content="website">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          type="text/css"
          href="{{ url_for('static', path='css/main.css') }}">

    <!-- Theme Color -->
    <meta name="theme-color" content="#0b1f3a">

    <!-- Favicon -->
    <link rel="icon"
          href="{{ url_for('static', path='icons/favicon.ico') }}"
          sizes="any">
  </head>

  <body class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <header>
      <nav class="navbar navbar-expand-md navbar-dark fixed-top cine-navbar">
        <div class="container">
          <!-- Logo -->
          <a class="navbar-brand fw-bold me-4"
             href="{{ url_for('home') }}">
            🎬 CineFast
          </a>

          <!-- Mobile menu button -->
          <button class="navbar-toggler"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#navbarToggle"
                  aria-controls="navbarToggle"
                  aria-expanded="false"
                  aria-label="Abrir menu">

            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- Navigation -->
          <div class="collapse navbar-collapse" id="navbarToggle">
            <div class="navbar-nav">

              <a class="nav-link"
                 href="{{ url_for('home') }}">
                Início
              </a>

              <a class="nav-link"
                 href="#">
                Filmes
              </a>

              <a class="nav-link"
                 href="{{ url_for('about') }}">
                Sobre
              </a>

            </div>
          </div>
        </div>
      </nav>
    </header>

    <!-- Main Content -->
    <main role="main" class="container flex-grow-1 cine-main">
      {% block content %}
      {% endblock content %}
    </main>

    <!-- Footer -->
    <footer class="cine-footer mt-auto py-4">

      <div class="container text-center">

        <p class="mb-1">
          🎬 <strong>CineFast</strong>
        </p>

        <p class="mb-0">
          <small>
            © <span id="year"></span> - Miguel Vanelli
          </small>
        </p>

      </div>

    </footer>


    <!-- Current Year -->
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

  </body>
</html>
